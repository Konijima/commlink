# Minimal TLS reverse proxy for commlink on nginx — the counterpart to the Caddyfile.
#
# Caddy needs none of this: it forwards WebSocket upgrades and streams responses
# unbuffered by default. nginx does neither on its own, and this server relies on both
# (see deploy/README.md), so the two settings below are not optional here:
#
#   1. Forward the WebSocket upgrade. `/:topic/ws` — the primary subscribe route —
#      answers only the handshake; without the Upgrade/Connection headers it is a 404
#      and subscription breaks with nothing to explain why.
#   2. Do not buffer responses. `/:topic/json` streams messages as they are published
#      and never ends on its own, so a buffering proxy holds every line back forever.
#
# Replace push.example.com and the certificate paths with your own. Unlike Caddy, nginx
# does not obtain or renew the certificate itself; use certbot or your own tooling.

# Maps the request's Upgrade header to the Connection header to send upstream: `upgrade`
# for a WebSocket handshake, `close` otherwise. This block belongs in the `http { ... }`
# context (alongside the other `server` blocks), not inside `server`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A log format that writes $uri — the path alone — where the default `combined` format writes
# $request, which carries the query string with it. It exists for the subscribe routes, whose
# token rides in the URL as ?auth=<token>; see the note in `location /` below, and uncomment
# this together with the `access_log` line there.
#
# Like `map` above, `log_format` is an `http { ... }` directive: nginx refuses to load one
# inside a `server` or `location` block ("log_format directive is not allowed here") and will
# not start at all. Only the `access_log` line that selects the format by name belongs down
# there. So the pair is split — the definition here, the use in the location.
#log_format no_query '$remote_addr - $remote_user [$time_local] '
#                    '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name push.example.com;

    ssl_certificate     /etc/letsencrypt/live/push.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4500;

        # (1) Forward the WebSocket upgrade for /:topic/ws.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # (2) Stream, do not buffer, so /:topic/json is delivered line by line.
        proxy_buffering off;

        # A subscriber connection is idle between messages. The server sends a keepalive
        # every 45s (a WebSocket ping, or a blank line on /:topic/json), which resets this
        # timer; the generous window leaves room for a slow moment without a false drop.
        proxy_read_timeout 5m;

        # Preserve the original Host and forward the client's address in the standard
        # headers. The server trusts no proxy headers, so its request log records this
        # proxy as the remote address (not X-Forwarded-For) — the client's own address
        # lives in nginx's access log. The forwarded Host does reach the server's log.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A browser subscriber sends its bearer token as ?auth=<token> in the URL (a header
        # is not settable on a browser WebSocket handshake). The server redacts it from its
        # own log, but nginx's default access log records the full request line — query
        # string included — so the token lands here in clear. If your subscribers use
        # ?auth=, uncomment the line below to log through the `no_query` format defined in
        # the `http` context above (path only, no query string), so the token is not
        # persisted. `access_log off;` works too, at the cost of logging these routes at all.
        #
        # The format itself cannot be defined here — `log_format` is an http-context
        # directive, and nginx refuses to start on one written inside a `location`. Uncomment
        # both halves, each where it sits.
        #access_log /var/log/nginx/commlink.access.log no_query;
    }
}
