name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Run every version to completion; one failure should not mask another.
      fail-fast: false
      matrix:
        # The docs promise Node.js 22+ (the floor pnpm itself requires), so test
        # that floor and the current LTS rather than a single version.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      # Typecheck and test resolve imports for us; only Node's own loader can say
      # whether the built server actually starts.
      - name: Boot the built server
        run: pnpm -C server smoke

  # A single, matrix-independent status for branch protection to require. Its
  # name stays "verify" no matter how many Node versions the matrix grows to, so
  # the required check never has to be renamed when a version is added or dropped.
  verify:
    name: verify
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test leg passed
        if: ${{ needs.test.result != 'success' }}
        run: |
          echo "A test leg did not pass (result: ${{ needs.test.result }})."
          exit 1
